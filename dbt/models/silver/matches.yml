models:
  - name: matches      
    description: "Contains every players' matches."    
    columns:
      - name: date     
        description: "Date when the match happened."
        tests:
          - not_null
      - name: player_id
        description: "Player id."
      - name: game_id
        description: "Game id."             
      - name: score    
        description: "Player score."          
      - name: match_id       
        description: "Match id."
        tests:  
          - not_null      
      - name: game_name       
        description: "Game name."
        tests:  
          - not_null    
      - name: host_name
        description: "Host of the match session."
        tests:
          - not_null
      - name: game_owner
        description: "Owner of the game used in the match."
      - name: player_name
        description: "Player name as registered in source data."
        tests:
          - not_null
      - name: notes
        description: "Additional notes recorded for the match."
      - name: rank       
        description: "Players' rank."
      - name: game_owner_id
        description: "Game owner player id."
      - name: player_membership
        description: "Player membership category."
        tests:
          - not_null
          - accepted_values:
              values: ['M', 'G']
      - name: game_playing_time_real_hr
        tests:
          - not_null      
        description: "Time played per session in hh:mm:ss."    
      - name: weighted_rank
        description: '{{ doc("weighted_rank_matches") }}'                  
