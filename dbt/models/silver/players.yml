models:
  - name: players
    description: Table with player info
    columns:
      - name: name
        description: Players' name.
        tests:
          - unique
          - not_null
      - name: id
        description: Unique id of the player.
      - name: membership
        description: If the player is a member of the club or a guest.
        tests:
          - not_null
          - accepted_values:
              values: ['M', 'G']
      - name: last_attended_date
        description: The last time a player showed up.